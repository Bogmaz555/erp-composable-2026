# Optional NATS 3-node JetStream cluster sketch (Enterprise Q3).
# Usage: docker compose -f docker-compose.nats-ha.yml up -d
# Not wired into default pilot compose — opt-in only.
services:
  nats-1:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-cluster", "nats://0.0.0.0:6222", "-routes", "nats://nats-2:6222,nats://nats-3:6222", "--name", "nats-1"]
    ports:
      - "4222:4222"
      - "8222:8222"
  nats-2:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8223", "-cluster", "nats://0.0.0.0:6222", "-routes", "nats://nats-1:6222,nats://nats-3:6222", "--name", "nats-2"]
  nats-3:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8224", "-cluster", "nats://0.0.0.0:6222", "-routes", "nats://nats-1:6222,nats://nats-2:6222", "--name", "nats-3"]
