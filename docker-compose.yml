  quality_pgdata:
    driver: local
  eam_pgdata:
    driver: local
  plm_pgdata:
    driver: local
  tax_pgdata:
    driver: local
  hr_pgdata:
    driver: local
  analytics_pgdata:
    driver: local
  temporal_pgdata:
    driver: local
  nats_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  vault_data:
  vault_ha_data:
  vault_raft_data:
    driver: local
  meili_data:
    driver: local

# ═════════════════════════════════════════════════════════════════════════════
