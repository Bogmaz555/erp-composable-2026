# ═══════════════════════════════════════════════════════════════════════════════
# NATS JetStream Configuration — ERP Composable 2026
# Montowany jako /etc/nats/nats-server.conf w kontenerze (docker-compose nats)
#
# JetStream is ON for Pilot v1. Application streams are created idempotently by:
#   bash scripts/nats-bootstrap-streams.sh
# Streams: ETO_CORE | SUPPLY | QUALITY  (see apps/shared-kernel/src/jetstream)
# App flag: NATS_JETSTREAM=true  → publish/consume via JetStream kernel (PR 13/14)
# ═══════════════════════════════════════════════════════════════════════════════

# Klient
port: 4222
max_payload: 8MB

# Monitoring HTTP (:8222/healthz, /jsz, /varz — prefer over nats CLI in CI)
http_port: 8222

# JetStream — trwały storage dla event-driven architecture
# store_dir must match docker volume mount (nats_data → /data)
jetstream {
  store_dir: "/data"
  max_mem: 256MB
  max_file: 2GB
}

# Logowanie
debug: false
trace: false
logtime: true
