global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: erp-analytics-bi
    metrics_path: /bi/metrics/retention/prometheus
    static_configs:
      - targets: ['host.docker.internal:4011']
        labels:
          service: analytics-service
          domain: bi-snapshot

  # Enterprise 2.1 P1 — gateway Prometheus text metrics
  - job_name: erp-api-gateway
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:4005']
        labels:
          service: api-gateway
          domain: core

  # Honesty residual: other Nest services lack /metrics yet — health via health-matrix.sh
  # Optional future: blackbox_exporter probes on :4002-4011 /health
