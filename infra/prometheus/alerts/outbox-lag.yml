# Outbox lag / failure alerts (Enterprise E1)
groups:
  - name: erp-outbox
    rules:
      - alert: ErpOutboxPendingHigh
        expr: sum(erp_outbox_pending_events) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox pending events high"
          description: "More than 100 pending outbox events for 15m — check relay and NATS JetStream."
      - alert: ErpOutboxDlqNonZero
        expr: sum(erp_outbox_dead_letter_events) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox dead-letter non-zero"
          description: "DLQ has events — operator review required (see ONCALL-RUNBOOK)."
