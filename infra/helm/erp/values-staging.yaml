# Enterprise 2.1 P0 — staging profile (no secret values)
global:
  namespace: erp-staging

apiGateway:
  replicaCount: 2
  authEnforce: true
  useKeycloakJwks: true
  # PILOT=1 required by ci-pilot-auth-env (JWKS auth surface); coexists with ENTERPRISE=1
  pilot: "1"
  enterprise: "1"
  natsJetstream: "true"
  tenancyModel: DEDICATED_STACK
  natsUrl: nats://nats:4222

analyticsService:
  replicaCount: 2

enterprise:
  profile: staging
  ENTERPRISE: "1"
  NATS_JETSTREAM: "true"
  AUTH_ENFORCE: "true"
  USE_KEYCLOAK_JWKS: "true"
  TENANCY_MODEL: DEDICATED_STACK
  DEFAULT_TENANT_ID: "default"
  JWT_AUDIENCE: "erp-api"
  JWT_AZP_ALLOWLIST: "erp-frontend,erp-gateway"
  KEYCLOAK_ISSUER: "http://keycloak:8080/realms/erp"
  JWT_ISSUER_EXTRA: "http://127.0.0.1:8080/realms/erp,http://localhost:8080/realms/erp"
  MEILI_MASTER_KEY_SECRET_REF: "erp-meili-master-key"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  maxUnavailable: 1
networkPolicy:
  enabled: true
