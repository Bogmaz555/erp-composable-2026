# Enterprise Q3 — deny-by-default ingress within namespace (apply with networkPolicy.enabled)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-default-deny-ingress
  labels:
    app.kubernetes.io/part-of: erp-composable
    enterprise.q3: isolation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # empty ingress = deny all; allow rules in companion policies
