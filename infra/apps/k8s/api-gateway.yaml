apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-apps
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "erp-apps"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/erp/api-gateway"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/erp/api-gateway" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      serviceAccountName: erp-apps-sa
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4005
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "4005"
        # Prefer Vault-injected *_SERVICE_URL; defaults use cluster Service DNS (not 127.0.0.1)
        - name: PM_SERVICE_URL
          value: "http://pm-service:4002"
        - name: INV_SERVICE_URL
          value: "http://inv-service:4003"
        - name: PROC_SERVICE_URL
          value: "http://proc-service:4004"
        - name: MES_SERVICE_URL
          value: "http://mes-service:4006"
        - name: PLM_SERVICE_URL
          value: "http://plm-service:4007"
        - name: FIN_SERVICE_URL
          value: "http://finance:4010"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:4011"
        command: ["/bin/sh", "-c"]
        args:
        - |
          source /vault/secrets/config || true
          node apps/api-gateway/dist/main.js
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4005
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: erp-apps
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 4005
    targetPort: 4005
